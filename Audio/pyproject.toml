[project]
name = "audio"
version = "0.1.0"
description = "Speaker fusion for a kiosk: diarizer slots, Vision evidence, the customer lock and clean STT audio."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
nemo = [
    "torch>=2.0",
    "nemo_toolkit[asr]>=3.0,<4",
]
vision = ["websockets>=15.0.1"]
toml = ["tomlkit>=0.12"]

[dependency-groups]
dev = [
    "anyio>=4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "tomlkit>=0.12",
    "websockets>=15.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Ported from OpenJarvis with only their imports and harness changed; keep them diffable.
"tests/**/test_speaker*.py" = ["E501"]
# Port tools match OpenJarvis source lines verbatim.
"tools/port/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["nvidia: requires NVIDIA GPU"]
